<header class="header" [class.is-scrolled]="isScrolled()">
  <div class="header-inner container">
    <a class="brand" href="#top" (click)="closeMenu()">
      {{ personalInfo.displayName }}
    </a>

    <nav class="nav-desktop" aria-label="Primary">
      <ul>
        @for (link of navLinks; track link.fragment) {
          <li>
            <a
              [href]="'#' + link.fragment"
              [class.is-active]="activeFragment() === link.fragment"
              [attr.aria-current]="activeFragment() === link.fragment ? 'true' : null"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <div class="header-actions">
      <button type="button" class="btn btn-primary cv-btn" (click)="openCvPreview()">Download CV</button>

      <button
        #menuToggleBtn
        type="button"
        class="menu-toggle"
        (click)="toggleMenu()"
        [attr.aria-expanded]="isMenuOpen()"
        aria-controls="mobile-nav"
        [attr.aria-label]="isMenuOpen() ? 'Close menu' : 'Open menu'"
      >
        <span class="menu-toggle-bar" [class.is-open]="isMenuOpen()"></span>
      </button>
    </div>
  </div>

  @if (isMenuOpen()) {
    <nav id="mobile-nav" class="nav-mobile" aria-label="Primary">
      <ul>
        @for (link of navLinks; track link.fragment) {
          <li>
            <a
              [href]="'#' + link.fragment"
              [class.is-active]="activeFragment() === link.fragment"
              [attr.aria-current]="activeFragment() === link.fragment ? 'true' : null"
              (click)="closeMenu()"
            >
              {{ link.label }}
            </a>
          </li>
        }
        <li>
          <button type="button" class="btn btn-primary mobile-cv-btn" (click)="openCvPreview()">Download CV</button>
        </li>
      </ul>
    </nav>
  }
</header>
