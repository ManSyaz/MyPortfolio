<header class="header" [class.is-scrolled]="isScrolled()">
  <div class="header-inner container">
    <a class="brand" href="#top" (click)="closeMenu()">
      {{ personalInfo.displayName }}
    </a>

    <nav class="nav-desktop" aria-label="Primary">
      <ul>
        @for (link of navLinks; track link.fragment) {
          <li>
            <a [href]="'#' + link.fragment">{{ link.label }}</a>
          </li>
        }
      </ul>
    </nav>

    <div class="header-actions">
      <button
        type="button"
        class="theme-toggle"
        (click)="toggleTheme()"
        [attr.aria-label]="theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
      >
        @if (theme() === 'dark') {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <circle cx="12" cy="12" r="4.5" />
            <path d="M12 2.5v2.5M12 19v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2.5 12H5M19 12h2.5M4.2 19.8L6 18M18 6l1.8-1.8" />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11Z" />
          </svg>
        }
      </button>

      <a class="btn btn-secondary cv-btn" [href]="personalInfo.resumeUrl" download target="_blank" rel="noopener">
        Download CV
      </a>

      <button
        type="button"
        class="menu-toggle"
        (click)="toggleMenu()"
        [attr.aria-expanded]="isMenuOpen()"
        aria-controls="mobile-nav"
        [attr.aria-label]="isMenuOpen() ? 'Close menu' : 'Open menu'"
      >
        <span class="menu-toggle-bar" [class.is-open]="isMenuOpen()"></span>
      </button>
    </div>
  </div>

  @if (isMenuOpen()) {
    <nav id="mobile-nav" class="nav-mobile" aria-label="Primary">
      <ul>
        @for (link of navLinks; track link.fragment) {
          <li>
            <a [href]="'#' + link.fragment" (click)="closeMenu()">{{ link.label }}</a>
          </li>
        }
        <li>
          <a class="btn btn-primary mobile-cv-btn" [href]="personalInfo.resumeUrl" download target="_blank" rel="noopener" (click)="closeMenu()">
            Download CV
          </a>
        </li>
      </ul>
    </nav>
  }
</header>
