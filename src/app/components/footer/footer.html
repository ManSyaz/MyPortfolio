<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-top">
      <div>
        <p class="footer-name">{{ personalInfo.displayName }}</p>
        <p class="footer-tagline">{{ personalInfo.role }} · {{ personalInfo.location }}</p>
      </div>

      <ul class="footer-links">
        <li>
          <a [href]="'mailto:' + personalInfo.email" aria-label="Email">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <rect x="3" y="5" width="18" height="14" rx="2" />
              <path d="m4 7 8 6 8-6" />
            </svg>
          </a>
        </li>
        <li>
          <a [href]="personalInfo.githubUrl" target="_blank" rel="noopener" aria-label="GitHub">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <path d="m8 9-3 3 3 3M16 9l3 3-3 3M13.5 6.5l-3 11" />
            </svg>
          </a>
        </li>
        @if (linkedinHref) {
          <li>
            <a [href]="linkedinHref" target="_blank" rel="noopener" aria-label="LinkedIn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                <rect x="4" y="4" width="16" height="16" rx="3" />
                <path d="M9 10.5v6M9 8v.01M13 16.5v-3.6a1.9 1.9 0 0 1 3.8 0v3.6" />
              </svg>
            </a>
          </li>
        }
      </ul>
    </div>

    <div class="footer-bottom">
      <p>© {{ year }} {{ personalInfo.fullName }}</p>
      <a class="footer-back-to-top" href="#top">Back to top</a>
    </div>
  </div>
</footer>
