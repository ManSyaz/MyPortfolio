<section id="top" class="hero">
  <div class="container hero-inner">
    <div class="hero-content">
      <span class="eyebrow">{{ personalInfo.roleLong }} · {{ personalInfo.location }}</span>

      <h1 class="hero-headline">{{ personalInfo.heroHeadline }}</h1>

      <p class="hero-subline">{{ personalInfo.heroSubline }}</p>

      <div class="hero-ctas">
        <a class="btn btn-primary" href="#projects">View Work</a>
        <a class="btn btn-secondary" href="#contact">Get in Touch</a>
      </div>

      <div class="hero-meta">
        <span class="hero-availability">
          <span class="hero-availability-dot" aria-hidden="true"></span>
          {{ personalInfo.availability }}
        </span>

        <ul class="hero-stack" aria-label="Core technologies">
          @for (tech of personalInfo.heroStack; track tech) {
            <li class="chip">{{ tech }}</li>
          }
        </ul>
      </div>
    </div>

    <div class="hero-visual" aria-hidden="true">
      <div class="blueprint">
        <!-- Static for now — this diagram is a visual metaphor for "systems I
             build and maintain"; motion is reserved for the Phase 4 polish pass. -->
        <svg viewBox="0 0 320 320" fill="none">
          <defs>
            <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
              <path d="M 24 0 L 0 0 0 24" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.25" />
            </pattern>
          </defs>
          <rect width="320" height="320" fill="url(#grid)" />

          <!-- mesh: outer nodes connected to their neighbours -->
          <path
            d="M270 160 215 65 105 65 50 160 105 255 215 255 Z"
            class="mesh"
          />

          <!-- spokes: outer nodes to the central system -->
          <path d="M270 160 160 160 M215 65 160 160 M105 65 160 160 M50 160 160 160 M105 255 160 160 M215 255 160 160" class="link" />

          <!-- outer nodes -->
          <circle cx="270" cy="160" r="5.5" class="node" />
          <circle cx="215" cy="65" r="5.5" class="node" />
          <circle cx="105" cy="65" r="5.5" class="node" />
          <circle cx="50" cy="160" r="5.5" class="node" />
          <circle cx="105" cy="255" r="5.5" class="node" />
          <circle cx="215" cy="255" r="5.5" class="node" />

          <!-- central, highlighted node -->
          <circle cx="160" cy="160" r="15" class="node-ring" />
          <circle cx="160" cy="160" r="9" class="node-core" />
        </svg>
      </div>
    </div>
  </div>

  <a class="scroll-cue" href="#experience" aria-label="Scroll to experience section">
    <span></span>
  </a>
</section>
